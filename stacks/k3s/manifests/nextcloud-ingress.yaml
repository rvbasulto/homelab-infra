# SERVICE
# Kubernetes object that represents the access point to Nextcloud inside the cluster.
# No ClusterIP is assigned because the Endpoints point to an external IP.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-external
  namespace: ingress-external  # Dedicated namespace for services external to the cluster
spec:
  ports:
    - port: 8080  # Port where Nextcloud is running
---
# ENDPOINTS
# Manually defines the real IP where the external service lives.
# Kubernetes normally discovers Endpoints automatically (for internal pods),
# but since Nextcloud lives outside the cluster, we define it manually.
# The name MUST match the Service name so Kubernetes links them together.
apiVersion: v1
kind: Endpoints
metadata:
  name: nextcloud-external  # Same name as the Service so K8s associates them
  namespace: ingress-external
subsets:
  - addresses:
      - ip: 192.168.1.65  # Real IP of the Nextcloud server
    ports:
      - port: 8080  # Real Nextcloud port
---
# INGRESSROUTE
# Traefik-native object (more powerful than the standard K3s Ingress).
# Defines routing rules: which domain goes to which service.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: ingress-external
spec:
  entryPoints:
    - web       # HTTP (port 80)
    - websecure # HTTPS (port 443) — Traefik terminates TLS, forwards to Nextcloud over HTTP
  routes:
    - match: Host(`cloud.home.lab`)  # When a request arrives for cloud.home.lab...
      kind: Rule
      services:
        - name: nextcloud-external  # ...forward it to the Service defined above
          port: 8080                 # using Nextcloud's port