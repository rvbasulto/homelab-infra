---
- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create APT keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  get_url:
    url: "{{ docker_apt_repo }}/gpg"
    dest: "{{ docker_apt_keyring_path }}"
    mode: "0644"

- name: Get DEB architecture
  command: dpkg --print-architecture
  register: deb_arch
  changed_when: false

- name: Add Docker APT repository
  apt_repository:
    repo: >-
      deb [arch={{ deb_arch.stdout }} signed-by={{ docker_apt_keyring_path }}]
      {{ docker_apt_repo }} {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine packages
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
